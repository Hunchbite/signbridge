[workspace]
resolver = "2"
members = ["crates/signbridge"]
default-members = ["crates/signbridge"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Hunchbite/signbridge"
authors = ["Hunchbite Technologies Private Limited"]
rust-version = "1.77"
description = "Open-source signing framework for PKCS#11 tokens and OS certificate stores"

[workspace.dependencies]
signbridge = { path = "crates/signbridge", version = "0.1.0" }
anyhow = "1"
base64 = "0.22"
cryptoki = "0.12"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
