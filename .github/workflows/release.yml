name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build signbridge-rpc
        run: cargo build -p signbridge-rpc --release --target ${{ matrix.target }}
      - name: Stage asset
        shell: bash
        run: |
          EXT=""
          if [[ "${{ matrix.os }}" == windows-* ]]; then EXT=".exe"; fi
          SRC="target/${{ matrix.target }}/release/signbridge-rpc${EXT}"
          DEST="signbridge-rpc-${{ matrix.target }}${EXT}"
          cp "$SRC" "$DEST"
          echo "ASSET=$DEST" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find assets -type f -exec cp {} dist/ \;
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
