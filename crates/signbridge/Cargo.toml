[package]
name = "signbridge"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Embeddable signing framework: PKCS#11 digests, allowlists, pluggable UIs"
readme = "../../README.md"
keywords = ["pkcs11", "signing", "dsc", "pades", "token"]
categories = ["cryptography", "authentication"]

[lib]
name = "signbridge"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = ["pkcs11"]
pkcs11 = ["dep:cryptoki"]
# SoftHSM helpers for apps and integration tests. Not needed at runtime.
testing = ["dep:tempfile", "pkcs11"]
# C ABI (signbridge_new / signbridge_request / …).
ffi = []

[dependencies]
anyhow.workspace = true
base64.workspace = true
cryptoki = { workspace = true, optional = true }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
signbridge = { path = ".", features = ["testing"] }
base64.workspace = true
hex.workspace = true
tempfile.workspace = true
